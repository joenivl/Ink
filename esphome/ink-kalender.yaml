# Ink – gezinskalender op de Seeed reTerminal E1003 (10,3" e-paper, liggend)
#
# - twee schermen (tabs bovenin): week met notities, en maand
# - knoppen om Home Assistant te bedienen
# - afspraken en notities inspreken via de ingebouwde microfoon
# - notities afvinken door erop te tikken
# - spaarstand: slaapt tussendoor, wakker door een dubbeltik of knop
#
# Hoort bij de blueprint homeassistant/blueprints/ink_kalender.yaml.
#
# Dit bestand zet je niet zelf in Home Assistant: de kleine
# esphome/ha/ink-kalender.yaml haalt het als package van GitHub, samen met de
# C++-code (esphome/components/ink). Daar staan ook je secrets en je eigen
# instellingen; alles hieronder bij `substitutions` kun je daar overschrijven.
# Installatie: zie README.md.

substitutions:
  naam: ink-kalender  # niet veranderen: de blueprint verwacht deze naam
  # Waar de C++-code vandaan komt. github_token zet je in je eigen
  # ink-kalender.yaml (uit je secrets); ink_versie moet gelijk zijn aan de
  # `ref` van de package daar.
  ink_repo: https://github.com/joenivl/Ink
  ink_versie: main
  github_gebruiker: joenivl
  vriendelijke_naam: Ink kalender
  tijdzone: Europe/Amsterdam

  # Liggend, knoppen van de behuizing boven. Hangt hij andersom? Zet rotatie
  # op 180 en beide touch_mirror's op "true" (zie README, "Touch klopt niet").
  rotatie: "0"
  touch_mirror_x: "false"
  touch_mirror_y: "false"

  # Lettertype (Google Fonts). Voor een lettertype zonder vette variant, zoals
  # Patrick Hand: lettertype_vet: "400" en nep_vet: "true" (koppen worden dan
  # dubbel getekend).
  lettertype: Kalam
  lettertype_vet: "700"
  nep_vet: "false"

  # Microfoon. Verkeerd verstaan of een andere taal herkend? Eerst
  # mic_versterking omhoog (1-64; 4 = 4x zo luid). Klinkt het vervormd
  # (woorden verhaspeld bij luid praten), dan juist omlaag.
  mic_versterking: "4"
  mic_ruisonderdrukking: "2"  # 0 (uit) tot 4 (sterk)
  mic_auto_gain: 31dBFS       # 0dBFS = uit, 31dBFS = maximaal

  # Na zoveel tijd op het maandscherm terug naar de week.
  terug_naar_week_na: 5min

  # Spaarstand (aan/uit ook via de schakelaar "Spaarstand" in HA).
  # Het scherm slaapt na `wakker_na_gebruik` zonder aanraking, wordt elke
  # `wekker_elke` minuten stil wakker om de agenda te verversen en slaapt 's
  # nachts door van `nacht_van` tot `nacht_tot` uur. Wekken: dubbeltik of knop.
  spaarstand_bij_start: RESTORE_DEFAULT_ON
  wakker_na_gebruik: 60s
  wekker_elke: "30"
  nacht_van: "23"
  nacht_tot: "6"
  # Zet op "false" als het scherm meteen weer wakker wordt (dan alleen de knoppen).
  touch_wekt: "true"

  # Weersverwachting (kies een weer-entiteit in de blueprint). Een nieuwe
  # verwachting komt alleen in een nieuw tijdvak van `weer_elke` uur op het
  # scherm: bij "6" vanaf 0, 6, 12 en 18 uur (de eerste ronde daarna). Zo
  # knippert het scherm niet voor elke graad verschil.
  weer_elke: "6"

  # Een op het scherm afgevinkte notitie blijft nog zoveel minuten
  # doorgestreept staan; nog eens tikken zet hem terug.
  notitie_klaar_tonen: "60"

  # Geluidjes (aan/uit en volume ook in HA). Melodietjes in RTTTL-formaat:
  # d = standaardlengte, o = octaaf, b = tempo; daarna de noten.
  volume: "15"         # procent, startwaarde
  stil_van: "21"       # 's avonds/'s nachts stil van ... tot ... uur
  stil_tot: "7"
  geluid_tik: "tik:d=32,o=6,b=240:g"
  geluid_luister: "luister:d=32,o=6,b=200:c,g"
  geluid_klaar: "klaar:d=32,o=6,b=200:g,c"
  geluid_opgeslagen: "ok:d=16,o=6,b=200:c,e,g"
  geluid_melding: "melding:d=16,o=5,b=160:a,f"

  # Knoppen onderaan. Werkt met alles wat homeassistant.toggle snapt
  # (lampen, schakelaars, scripts, groepen). Naam leeg = knop verbergen.
  knop1_naam: Woonkamer
  knop1_entiteit: light.woonkamer
  knop2_naam: Keuken
  knop2_entiteit: light.keuken
  knop3_naam: Tuin
  knop3_entiteit: light.tuin
  knop4_naam: Alles uit
  knop4_entiteit: script.alles_uit

esphome:
  name: ${naam}
  friendly_name: ${vriendelijke_naam}
  min_version: 2026.7.0
  on_boot:
    # Vóór de hardware wordt ingesteld: vastgezette pinnen vrijgeven en
    # kijken waarom we wakker zijn.
    - priority: 900
      then:
        - lambda: |-
            ink::na_wakker_worden();
            id(wekreden) = ink::wekreden();
            auto &s = ink::staat();
            if (id(wekreden) != ink::WEK_STROOM)
              s.accu = ink::rtc_accu;
            if (id(wekreden) == ink::WEK_TIMER) {
              s.slaap = ink::SLAAPT;  // stille ronde
            } else if (id(wekreden) == ink::WEK_GEBRUIKER) {
              s.slaap = ink::WORDT_WAKKER;
              id(spreek_na_wekken) = ink::gewekt_door(ink::PIN_KNOP_GROEN);
            }
    - priority: 600
      then:
        - output.turn_on: mic_stroom
        - output.turn_on: accu_meten
        - pcf8563.read_time: rtc_tijd
        - lambda: |-
            auto &s = ink::staat();
            s.knoppen[0].naam = "${knop1_naam}";
            s.knoppen[1].naam = "${knop2_naam}";
            s.knoppen[2].naam = "${knop3_naam}";
            s.knoppen[3].naam = "${knop4_naam}";
    - priority: -100
      then:
        - lambda: |-
            // Stille ronde: niets tekenen tot we weten of er iets veranderd is.
            if (id(wekreden) == ink::WEK_STROOM)
              ink::ververs_mask() |= ink::VOL;
            else if (id(wekreden) == ink::WEK_GEBRUIKER)
              ink::ververs_mask() |= ink::BALK;  // "Even wakker worden…"
        - script.execute: ververs
        - if:
            condition:
              lambda: return id(wekreden) == ink::WEK_TIMER;
            then:
              - script.execute: stille_ronde_timeout
            else:
              - script.execute: slaap_timer
        - if:
            condition:
              lambda: return id(wekreden) == ink::WEK_GEBRUIKER;
            then:
              - script.execute: wakker_timeout

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Layout en logica (C++), van GitHub zoals de rest van dit bestand.
external_components:
  - source:
      type: git
      url: ${ink_repo}
      ref: ${ink_versie}
      username: ${github_gebruiker}
      password: ${github_token}
      path: esphome/components
    components: [ink]
    refresh: 0s

ink:

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: UART0

api:
  # encryption: in je eigen ink-kalender.yaml (secret api_sleutel)
  on_client_connected:
    - delay: 2s
    # Vraag Home Assistant om de agenda te sturen.
    - homeassistant.event:
        event: esphome.ink_klaar
  actions:
    - action: toon_agenda
      variables:
        afspraken: string
        notities: string
        weer: string
      then:
        - lambda: |-
            auto &s = ink::staat();
            auto nu = id(ha_tijd).now();
            if (!nu.is_valid())
              nu = id(rtc_tijd).now();
            if (nu.is_valid()) {
              s.vandaag = {nu.year, nu.month, nu.day_of_month};
              s.tijd_geldig = true;
            }
            // Het weer staat in RTC-geheugen en verandert maar een paar keer per dag.
            ink::neem_weer_over(ink::rtc_weer, weer,
                                nu.is_valid() ? ink::weer_vak(ink::dagnummer(s.vandaag), nu.hour, ${weer_elke}) : -1);
            // Net afgevinkte notities blijven nog even staan, ook als HA ze al weglaat.
            auto lijst = ink::met_klaar(ink::lees_notities(notities), ink::rtc_klaar,
                                        nu.is_valid() ? nu.timestamp : 0, ${notitie_klaar_tonen});
            const bool nieuw = !s.data_ontvangen || s.ruw_afspraken != afspraken ||
                               !ink::zelfde_notities(lijst, s.notities) || s.ruw_weer != ink::rtc_weer.tekst;
            s.ruw_notities = notities;
            if (nieuw) {
              s.ruw_afspraken = afspraken;
              s.ruw_weer = ink::rtc_weer.tekst;
              s.afspraken = ink::lees_afspraken(afspraken);
              s.notities = lijst;
              s.weer = ink::lees_weer(s.ruw_weer);
              s.data_ontvangen = true;
            }
            if (s.slaap == ink::SLAAPT) {
              // Stille ronde: alleen verversen als er iets veranderd is sinds het inslapen.
              if (ink::inhoud_hash(s) != ink::rtc_inhoud_hash)
                ink::ververs_mask() |= ink::VOL;
            } else if (s.slaap == ink::WORDT_WAKKER) {
              s.slaap = ink::WAKKER;
              id(net_wakker) = true;
              ink::ververs_mask() |= ink::VOL;
            } else if (nieuw || id(wacht_op_agenda)) {
              id(wacht_op_agenda) = false;
              ink::ververs_mask() |= ink::VOL;
            }
        - script.execute: ververs
        - if:
            condition:
              lambda: return ink::staat().slaap == ink::SLAAPT;
            then:
              - script.execute: ga_slapen
        - if:
            condition:
              lambda: return id(net_wakker);
            then:
              - lambda: id(net_wakker) = false;
              - script.execute: klaar_met_wekken
    - action: toon_voorstel
      variables:
        titel: string
        datum: string
        begin: string
        eind: string
        gehoord: string
        soort: string
      then:
        - lambda: |-
            auto &s = ink::staat();
            s.voorstel = {titel, datum, begin, eind, gehoord, soort};
            s.status = ink::VOORSTEL;
            ink::ververs_mask() |= ink::VENSTER | ink::BALK;
        - script.execute: ververs
        - script.execute: venster_sluiten_na_tijd
        - script.execute: slaap_timer
    - action: toon_melding
      variables:
        tekst: string
      then:
        - script.execute:
            id: melding
            tekst: !lambda return tekst;

ota:
  # Versleuteld met de API-sleutel; een apart OTA-wachtwoord is niet nodig.
  - platform: esphome
    encryption:

wifi:
  # ssid, password en ap-password: in je eigen ink-kalender.yaml (secrets)
  ap:
    ssid: Ink-Kalender

captive_portal:

spi:
  id: epd_spi
  clk_pin: GPIO7
  mosi_pin: GPIO9
  miso_pin: GPIO8

i2c:
  id: i2c_bus
  sda: GPIO19
  scl: GPIO20

globals:
  - id: wacht_op_agenda
    type: bool
    initial_value: "false"
  - id: spraak_tekst_ontvangen
    type: bool
    initial_value: "false"
  - id: minuten_offline
    type: int
    initial_value: "0"
  - id: wekreden
    type: int
    initial_value: "0"
  - id: spreek_na_wekken
    type: bool
    initial_value: "false"
  - id: net_wakker
    type: bool
    initial_value: "false"

time:
  - platform: pcf8563
    id: rtc_tijd
    address: 0x51
    update_interval: never
  - platform: homeassistant
    id: ha_tijd
    timezone: ${tijdzone}
    on_time_sync:
      - pcf8563.write_time: rtc_tijd
    on_time:
      # Nieuwe dag: alles opnieuw (ook tegen 'ghosting').
      - seconds: 5
        minutes: 0
        hours: 0
        then:
          - lambda: |-
              if (ink::staat().slaap == ink::WAKKER)
                ink::ververs_mask() |= ink::VOL;
          - script.execute: ververs

interval:
  - interval: 1min
    then:
      - lambda: |-
          auto &s = ink::staat();
          const bool verbonden = global_api_server->is_connected();
          id(minuten_offline) = verbonden ? 0 : id(minuten_offline) + 1;
          // Pas na 5 minuten 'geen verbinding' tonen; een herstart van HA duurt even.
          const bool nu = id(minuten_offline) < 5;
          if (nu != s.verbonden) {
            s.verbonden = nu;
            if (s.slaap == ink::WAKKER)
              ink::ververs_mask() |= ink::VOL;
          }
          // Afgevinkte notities weghalen als hun tijd om is.
          auto tijd = id(ha_tijd).now();
          if (!tijd.is_valid())
            tijd = id(rtc_tijd).now();
          if (s.data_ontvangen && s.slaap == ink::WAKKER && tijd.is_valid()) {
            auto lijst = ink::met_klaar(ink::lees_notities(s.ruw_notities), ink::rtc_klaar, tijd.timestamp,
                                        ${notitie_klaar_tonen});
            if (!ink::zelfde_notities(lijst, s.notities)) {
              s.notities = lijst;
              ink::ververs_mask() |= ink::NOTITIES;
            }
          }
      - script.execute: ververs

sensor:
  # Accu: spanning via een deler (x2) op GPIO1, percentage volgens de
  # ontlaadcurve van Seeed. Met USB eraan staat hij rond de 100%.
  - platform: adc
    id: accuspanning
    name: Accuspanning
    pin: GPIO1
    attenuation: 12db
    update_interval: 60s
    accuracy_decimals: 2
    entity_category: diagnostic
    filters:
      - multiply: 2.0
      - median:
          window_size: 5
          send_every: 5
          send_first_at: 1
    # Meteen het percentage bijwerken: de eerste meting komt direct na het
    # opstarten, ook na het wekken (anders bleef de accu een tijd leeg).
    on_value:
      - component.update: accu
  - platform: template
    id: accu
    name: Accu
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      if (std::isnan(id(accuspanning).state))
        return {};  // nog geen meting
      return id(accuspanning).state;
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 3.27 -> 0.0
            - 3.30 -> 5.0
            - 3.41 -> 10.0
            - 3.49 -> 20.0
            - 3.58 -> 30.0
            - 3.68 -> 40.0
            - 3.75 -> 50.0
            - 3.80 -> 60.0
            - 3.85 -> 70.0
            - 3.91 -> 80.0
            - 3.96 -> 90.0
            - 4.15 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100
      - round: 0
    on_value:
      # Het scherm alleen volledig verversen als het percentage een stap van
      # 10% maakt of onder de 'opladen!'-grens zakt; anders knippert het te vaak.
      - lambda: |-
          auto &s = ink::staat();
          auto emmer = [](float p) { return p <= ink::ACCU_LAAG ? -1 : static_cast<int>(p) / 10; };
          // De eerste meting na het opstarten gaat mee met de eerste volledige verversing.
          const bool anders = !std::isnan(s.accu) && emmer(s.accu) != emmer(x);
          s.accu = x;
          if (anders && s.slaap == ink::WAKKER)
            ink::ververs_mask() |= ink::VOL;
      - script.execute: ververs
  - platform: sht4x
    temperature:
      id: temperatuur
      name: Temperatuur
      on_value:
        - lambda: ink::staat().temperatuur = x;
    humidity:
      id: vochtigheid
      name: Luchtvochtigheid
      on_value:
        - lambda: ink::staat().vochtigheid = x;
    update_interval: 5min

text_sensor:
  - platform: homeassistant
    id: knop1_status
    entity_id: ${knop1_entiteit}
    internal: true
    on_value:
      - script.execute:
          id: knop_status
          nr: 0
          status: !lambda return x;
  - platform: homeassistant
    id: knop2_status
    entity_id: ${knop2_entiteit}
    internal: true
    on_value:
      - script.execute:
          id: knop_status
          nr: 1
          status: !lambda return x;
  - platform: homeassistant
    id: knop3_status
    entity_id: ${knop3_entiteit}
    internal: true
    on_value:
      - script.execute:
          id: knop_status
          nr: 2
          status: !lambda return x;
  - platform: homeassistant
    id: knop4_status
    entity_id: ${knop4_entiteit}
    internal: true
    on_value:
      - script.execute:
          id: knop_status
          nr: 3
          status: !lambda return x;

output:
  - platform: gpio
    id: mic_stroom
    pin: GPIO38
  # Zet de spanningsdeler voor de accumeting aan (E1003: GPIO40)
  - platform: gpio
    id: accu_meten
    pin: GPIO40
  - platform: ledc
    id: zoemer
    pin: GPIO45

rtttl:
  id: melodie
  output: zoemer
  gain: ${volume}%

binary_sensor:
  - platform: gpio
    id: knop_groen
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - script.execute:
          id: tik
          zone: !lambda return ink::SPREEK;
  - platform: gpio
    id: knop_wit_rechts
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - if:
          condition:
            lambda: return ink::staat().slaap != ink::WAKKER;
          then:
            - script.execute: wek_op
          else:
            - script.execute: slaap_timer
            - lambda: ink::ververs_mask() |= ink::VOL;
            - script.execute: ververs
  - platform: gpio
    id: knop_wit_links
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - if:
          condition:
            lambda: return ink::staat().slaap != ink::WAKKER;
          then:
            - script.execute: wek_op
          else:
            - script.execute: slaap_timer
            - script.execute:
                id: wissel_scherm
                scherm: !lambda |-
                  return ink::staat().scherm == ink::SCHERM_WEEK ? ink::SCHERM_MAAND : ink::SCHERM_WEEK;

i2s_audio:
  - id: i2s_mic
    i2s_lrclk_pin: GPIO42

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_mic
    adc_type: external
    pdm: true
    i2s_din_pin: GPIO41
    correct_dc_offset: true

voice_assistant:
  id: spraak
  microphone:
    microphone: mic
    gain_factor: ${mic_versterking}
  noise_suppression_level: ${mic_ruisonderdrukking}
  auto_gain: ${mic_auto_gain}
  on_listening:
    - script.execute:
        id: geluid
        soort: 1  # luister
    - script.execute:
        id: zet_status
        status: !lambda return ink::LUISTEREN;
  on_stt_vad_end:
    - script.execute:
        id: geluid
        soort: 2  # klaar
    - script.execute:
        id: zet_status
        status: !lambda return ink::VERWERKEN;
    # Ook als de spraakherkenning nooit antwoordt niet blijven hangen.
    - script.execute: wacht_op_ha
  on_stt_end:
    - lambda: id(spraak_tekst_ontvangen) = true;
    - if:
        condition:
          lambda: return !x.empty();
        then:
          - script.execute:
              id: zet_status
              status: !lambda return ink::VERWERKEN;
          - homeassistant.event:
              event: esphome.ink_spraak
              data:
                tekst: !lambda return x;
          - script.execute: wacht_op_ha
        else:
          - script.execute:
              id: melding
              tekst: Ik heb niets verstaan. Probeer het nog eens.
  on_error:
    - if:
        condition:
          lambda: return !id(spraak_tekst_ontvangen) && ink::staat().status != ink::RUST;
        then:
          - script.execute:
              id: melding
              tekst: !lambda |-
                return "Spraakherkenning mislukt: " + message;
  on_end:
    - script.execute: slaap_timer
    - if:
        condition:
          lambda: return !id(spraak_tekst_ontvangen) && ink::staat().status == ink::LUISTEREN;
        then:
          - script.execute:
              id: zet_status
              status: !lambda return ink::RUST;
    # Wel gesproken, maar de herkenning stopte zonder tekst of foutmelding.
    - if:
        condition:
          lambda: return !id(spraak_tekst_ontvangen) && ink::staat().status == ink::VERWERKEN;
        then:
          - script.execute:
              id: melding
              tekst: Geen tekst van de spraakherkenning. Probeer het nog eens.

deep_sleep:
  id: slaap

number:
  - platform: template
    id: volume
    name: Volume
    icon: mdi:volume-medium
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 50
    step: 5
    optimistic: true
    restore_value: true
    initial_value: ${volume}
    on_value:
      - lambda: id(melodie).set_gain(x / 100.0f);
    set_action:
      - lambda: id(melodie).set_gain(x / 100.0f);
      # even laten horen hoe hard het is
      - script.execute:
          id: geluid
          soort: 0

switch:
  - platform: template
    id: geluid_aan
    name: Geluid
    icon: mdi:volume-high
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: template
    id: spaarstand
    name: Spaarstand
    icon: mdi:sleep
    optimistic: true
    restore_mode: ${spaarstand_bij_start}
    entity_category: config
    on_turn_on:
      - script.execute: slaap_timer
    on_turn_off:
      - script.stop: slaap_timer
      - script.stop: ga_slapen
      - script.execute: wek_op

touchscreen:
  - platform: gt911
    id: touch
    display: epd
    interrupt_pin: GPIO2
    reset_pin: GPIO48
    transform:
      mirror_x: ${touch_mirror_x}
      mirror_y: ${touch_mirror_y}
    on_touch:
      - lambda: |-
          ESP_LOGI("ink", "Aanraking op x=%d, y=%d", touch.x, touch.y);
      - script.execute:
          id: tik
          zone: !lambda return ink::raak(ink::staat(), touch.x, touch.y);  # GEEN als hij slaapt

script:
  # Vraagt een schermverversing aan voor alles wat in ververs_mask staat.
  # Volledig = GC16 (grijstinten, knippert even), anders DU (snel).
  - id: ververs
    mode: queued
    max_runs: 10
    then:
      - if:
          condition:
            lambda: return ink::ververs_mask() != 0;
          then:
            - it8951.update:
                id: epd
                mode: !lambda |-
                  return (ink::ververs_mask() & ink::VOL) ? it8951::UPDATE_MODE_GC16 : it8951::UPDATE_MODE_DU;

  # Speelt een geluidje, tenzij geluid uit staat of het stille uren zijn.
  - id: geluid
    mode: restart
    parameters:
      soort: int
    then:
      - if:
          condition:
            lambda: |-
              if (!id(geluid_aan).state)
                return false;
              auto nu = id(ha_tijd).now();
              if (!nu.is_valid())
                nu = id(rtc_tijd).now();
              if (!nu.is_valid())
                return true;
              const int van = ${stil_van}, tot = ${stil_tot};
              const bool stil = van > tot ? (nu.hour >= van || nu.hour < tot) : (nu.hour >= van && nu.hour < tot);
              return !stil;
          then:
            - rtttl.play:
                rtttl: !lambda |-
                  static const char *const MELODIE[] = {"${geluid_tik}", "${geluid_luister}", "${geluid_klaar}",
                                                        "${geluid_opgeslagen}", "${geluid_melding}"};
                  return std::string(MELODIE[soort]);

  - id: zet_status
    parameters:
      status: int
    then:
      - lambda: |-
          auto &s = ink::staat();
          const bool venster_was_open = ink::venster_open(s);
          s.status = static_cast<ink::Status>(status);
          // Venster dicht = de maand eronder moet terug, dus volledig tekenen.
          ink::ververs_mask() |= (venster_was_open && !ink::venster_open(s)) ? ink::VOL : ink::BALK;
      - script.execute: ververs

  - id: melding
    parameters:
      tekst: string
    then:
      - script.execute:
          id: geluid
          soort: 4  # melding
      - script.stop: wacht_op_ha
      - lambda: |-
          auto &s = ink::staat();
          s.melding = tekst;
          s.status = ink::MELDING;
          ink::ververs_mask() |= ink::VENSTER | ink::BALK;
      - script.execute: ververs
      - script.execute: venster_sluiten_na_tijd

  # Geen voorstel van Home Assistant binnen een minuut? Dan melden.
  - id: wacht_op_ha
    mode: restart
    then:
      - delay: 60s
      - if:
          condition:
            lambda: return ink::staat().status == ink::VERWERKEN;
          then:
            - script.execute:
                id: melding
                tekst: Geen antwoord van Home Assistant. Staat de Ink-automatisering aan?

  - id: venster_sluiten_na_tijd
    mode: restart
    then:
      - delay: 3min
      - if:
          condition:
            lambda: return ink::venster_open(ink::staat());
          then:
            - script.execute:
                id: zet_status
                status: !lambda return ink::RUST;

  # Na 'Opslaan' wachten we op de nieuwe agenda uit HA, zodat het scherm
  # maar één keer ververst. Komt die niet, dan toch verversen.
  - id: wacht_op_agenda_timeout
    mode: restart
    then:
      - delay: 15s
      - if:
          condition:
            lambda: return id(wacht_op_agenda);
          then:
            - lambda: |-
                id(wacht_op_agenda) = false;
                ink::ververs_mask() |= ink::VOL;
            - script.execute: ververs

  - id: knop_status
    parameters:
      nr: int
      status: string
    then:
      - lambda: |-
          auto &k = ink::staat().knoppen[nr];
          const bool aan = status == "on" || status == "open" || status == "playing" || status == "home";
          if (aan != k.aan) {
            k.aan = aan;
            if (ink::staat().slaap == ink::WAKKER)
              ink::ververs_mask() |= ink::BALK;
          }
      - script.execute: ververs

  - id: wissel_scherm
    parameters:
      scherm: int
    then:
      - lambda: |-
          auto &s = ink::staat();
          if (s.scherm != scherm) {
            s.scherm = static_cast<ink::Scherm>(scherm);
            ink::ververs_mask() |= ink::VOL;
          }
      - script.execute: ververs
      - if:
          condition:
            lambda: return scherm != ink::SCHERM_WEEK;
          then:
            - script.execute: terug_naar_week
          else:
            - script.stop: terug_naar_week

  - id: terug_naar_week
    mode: restart
    then:
      - delay: ${terug_naar_week_na}
      - script.execute:
          id: wissel_scherm
          scherm: !lambda return ink::SCHERM_WEEK;

  # --- spaarstand ---------------------------------------------------------
  # Na een tijd zonder gebruik gaan slapen (niet tijdens inspreken of een venster).
  - id: slaap_timer
    mode: restart
    then:
      - delay: ${wakker_na_gebruik}
      - if:
          condition:
            lambda: return id(spaarstand).state && ink::staat().slaap == ink::WAKKER;
          then:
            - if:
                condition:
                  or:
                    - voice_assistant.is_running
                    - lambda: return ink::staat().status != ink::RUST;
                then:
                  - script.execute: slaap_timer
                else:
                  - script.execute: ga_slapen

  - id: ga_slapen
    mode: single
    then:
      - if:
          condition:
            lambda: return id(spaarstand).state;
          then:
            - script.stop: slaap_timer
            - lambda: |-
                auto &s = ink::staat();
                if (s.slaap != ink::SLAAPT) {
                  // Slaapbalk tonen. Stond er een venster of de maand, dan het
                  // hele scherm terug naar de week.
                  const bool alles = ink::venster_open(s) || s.scherm != ink::SCHERM_WEEK;
                  s.slaap = ink::SLAAPT;
                  s.status = ink::RUST;
                  s.scherm = ink::SCHERM_WEEK;
                  ink::ververs_mask() |= alles ? ink::VOL : ink::BALK;
                }
            - script.execute: ververs
            # Wachten tot het scherm klaar is met verversen
            - delay: 6s
            - lambda: |-
                ink::rtc_inhoud_hash = ink::inhoud_hash(ink::staat());
                ink::rtc_accu = ink::staat().accu;
                ink::bereid_slaap_voor(${touch_wekt}, id(i2c_bus), id(touch)->get_i2c_address());
            - deep_sleep.enter:
                id: slaap
                sleep_duration: !lambda |-
                  auto nu = id(ha_tijd).now();
                  if (!nu.is_valid())
                    nu = id(rtc_tijd).now();
                  return ink::slaapduur_ms(nu.is_valid() ? nu.hour : -1, nu.is_valid() ? nu.minute : 0,
                                           ${wekker_elke}, ${nacht_van}, ${nacht_tot});

  # Gewekt (of tik tijdens een stille ronde): als de agenda er al is meteen
  # tonen, anders "Even wakker worden…" tot Home Assistant hem stuurt.
  - id: wek_op
    mode: single
    then:
      - script.stop: ga_slapen
      - script.stop: stille_ronde_timeout
      - lambda: |-
          auto &s = ink::staat();
          if (s.slaap == ink::SLAAPT && s.data_ontvangen) {
            s.slaap = ink::WAKKER;
            id(net_wakker) = true;
            ink::ververs_mask() |= ink::VOL;
          } else if (s.slaap == ink::SLAAPT) {
            s.slaap = ink::WORDT_WAKKER;
            ink::ververs_mask() |= ink::BALK;
          }
      - script.execute: ververs
      - if:
          condition:
            lambda: return id(net_wakker);
          then:
            - lambda: id(net_wakker) = false;
            - script.execute: klaar_met_wekken
          else:
            - script.execute: wakker_timeout

  - id: klaar_met_wekken
    then:
      - script.stop: wakker_timeout
      - script.execute: slaap_timer
      - if:
          condition:
            lambda: return id(spreek_na_wekken);
          then:
            - lambda: id(spreek_na_wekken) = false;
            - delay: 500ms
            - script.execute:
                id: tik
                zone: !lambda return ink::SPREEK;

  # Gewekt, maar Home Assistant reageert niet
  - id: wakker_timeout
    mode: restart
    then:
      - delay: 40s
      - if:
          condition:
            lambda: return ink::staat().slaap == ink::WORDT_WAKKER;
          then:
            - lambda: ink::staat().slaap = ink::WAKKER;
            - script.execute:
                id: melding
                tekst: Geen verbinding met Home Assistant. Probeer het straks nog eens.
            - script.execute: slaap_timer

  # Stille ronde zonder antwoord van Home Assistant: weer gaan slapen
  - id: stille_ronde_timeout
    mode: restart
    then:
      - delay: 45s
      - if:
          condition:
            lambda: return ink::staat().slaap == ink::SLAAPT;
          then:
            - script.execute: ga_slapen

  - id: tik
    parameters:
      zone: int
    then:
      # Slaapt hij (of wordt hij wakker)? Dan eerst wekken. De groene knop
      # start daarna meteen het inspreken.
      - if:
          condition:
            lambda: return ink::staat().slaap != ink::WAKKER;
          then:
            - lambda: |-
                if (zone == ink::SPREEK)
                  id(spreek_na_wekken) = true;
            - script.execute: wek_op
          else:
            - script.execute: slaap_timer
            - if:
                condition:
                  lambda: return zone != ink::GEEN;
                then:
                  - script.execute:
                      id: geluid
                      soort: 0  # tik
            # Tabs
            - if:
                condition:
                  lambda: return zone == ink::TAB_WEEK || zone == ink::TAB_MAAND;
                then:
                  - script.execute:
                      id: wissel_scherm
                      scherm: !lambda |-
                        return zone == ink::TAB_MAAND ? ink::SCHERM_MAAND : ink::SCHERM_WEEK;
            # Spreken
            - if:
                condition:
                  lambda: return zone == ink::SPREEK;
                then:
                  # Tijdens "Even denken…" niets doen: stoppen zou de herkenning afbreken.
                  - if:
                      condition:
                        lambda: return ink::staat().status != ink::VERWERKEN;
                      then:
                        - if:
                            condition: voice_assistant.is_running
                            then:
                              - voice_assistant.stop:
                            else:
                              - script.stop: venster_sluiten_na_tijd
                              - lambda: id(spraak_tekst_ontvangen) = false;
                              - script.execute:
                                  id: zet_status
                                  status: !lambda return ink::LUISTEREN;
                              - voice_assistant.start:
            # Home Assistant-knoppen
            - if:
                condition:
                  lambda: return zone >= ink::KNOP1 && zone < ink::KNOP1 + 4;
                then:
                  - homeassistant.action:
                      action: homeassistant.toggle
                      data:
                        entity_id: !lambda |-
                          static const char *const entiteiten[] = {
                              "${knop1_entiteit}", "${knop2_entiteit}", "${knop3_entiteit}", "${knop4_entiteit}"};
                          return std::string(entiteiten[zone - ink::KNOP1]);
            # Notitie afvinken (meteen doorgestreept en nog even zichtbaar), of een
            # afgevinkte terugzetten
            - if:
                condition:
                  lambda: |-
                    const int i = zone - ink::NOTITIE0;
                    return i >= 0 && i < (int) ink::staat().notities.size();
                then:
                  - homeassistant.event:
                      event: esphome.ink_afvinken
                      data:
                        lijst: !lambda return ink::staat().notities[zone - ink::NOTITIE0].lijst;
                        uid: !lambda return ink::staat().notities[zone - ink::NOTITIE0].uid;
                        klaar: !lambda |-
                          return ink::staat().notities[zone - ink::NOTITIE0].afgevinkt ? "nee" : "ja";
                  - lambda: |-
                      auto &n = ink::staat().notities[zone - ink::NOTITIE0];
                      n.afgevinkt = !n.afgevinkt;
                      if (n.afgevinkt) {
                        auto tijd = id(ha_tijd).now();
                        if (!tijd.is_valid())
                          tijd = id(rtc_tijd).now();
                        ink::onthoud_klaar(ink::rtc_klaar, n, zone - ink::NOTITIE0, tijd.is_valid() ? tijd.timestamp : 0);
                      } else {
                        ink::vergeet_klaar(ink::rtc_klaar, n);
                      }
                      ink::ververs_mask() |= ink::NOTITIES;
                  - script.execute: ververs
            # Voorstel opslaan
            - if:
                condition:
                  lambda: return zone == ink::OPSLAAN;
                then:
                  - script.execute:
                      id: geluid
                      soort: 3  # opgeslagen
                  - homeassistant.event:
                      event: esphome.ink_opslaan
                      data:
                        titel: !lambda return ink::staat().voorstel.titel;
                        datum: !lambda return ink::staat().voorstel.datum;
                        begin: !lambda return ink::staat().voorstel.begin;
                        eind: !lambda return ink::staat().voorstel.eind;
                        soort: !lambda return ink::staat().voorstel.soort;
                  - script.stop: venster_sluiten_na_tijd
                  - lambda: |-
                      ink::staat().status = ink::RUST;
                      id(wacht_op_agenda) = true;
                      ink::ververs_mask() |= ink::BALK;
                  - script.execute: ververs
                  - script.execute: wacht_op_agenda_timeout
            # Annuleren / OK
            - if:
                condition:
                  lambda: return zone == ink::ANNULEER || zone == ink::OK;
                then:
                  - script.stop: venster_sluiten_na_tijd
                  - script.execute:
                      id: zet_status
                      status: !lambda return ink::RUST;

font:
  - file: gfonts://${lettertype}@400
    id: f_klein
    size: 22
    bpp: 4
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: gfonts://${lettertype}@400
    id: f_normaal
    size: 26
    bpp: 4
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
    # Iconen in titels en notities (zwart-wit emoji), alleen in dit font: alle
    # titels en notities staan in f_normaal, en meer past niet in de app-partitie.
    # Andere emoji haalt de firmware weg; houd de lijst gelijk aan ICONEN in
    # ink_kalender.h.
    extras: &iconen
      - file:
          type: gfonts
          family: Noto Emoji
          weight: 400
        glyphs: [
          "⏰", "☀", "☕", "♻", "⚠", "⚽", "⛄", "⛳", "⛺", "✂", "✅", "✈", "✏", "✔", "✨", "❄",
          "❌", "❓", "❗", "❤", "⭐", "🌈", "🌍", "🌙", "🌟", "🌧", "🌱", "🌷", "🌻", "🍕", "🍰", "🍴",
          "🍷", "🍺", "🍽", "🎁", "🎂", "🎃", "🎄", "🎅", "🎈", "🎉", "🎓", "🎟", "🎤", "🎨", "🎫", "🎬",
          "🎭", "🎮", "🎯", "🎵", "🎶", "🎸", "🎹", "🎾", "🎿", "🏀", "🏃", "🏆", "🏊", "🏋", "🏔", "🏖",
          "🏠", "🏡", "🏥", "🏫", "🐈", "🐕", "🐣", "🐰", "🐱", "🐴", "🐶", "🐾", "👋", "👍", "👏", "👓",
          "👦", "👧", "👨", "👩", "👪", "👴", "👵", "👶", "👻", "💇", "💉", "💊", "💍", "💕", "💡", "💪",
          "💰", "💶", "💻", "💼", "📅", "📆", "📌", "📖", "📚", "📝", "📞", "📧", "📷", "📺", "🔔", "🔥",
          "🔧", "🔨", "🕯", "🗑", "😀", "😊", "😍", "😎", "😴", "🙏", "🚆", "🚌", "🚗", "🚢", "🚲", "🚴",
          "🛁", "🛏", "🛒", "🤒", "🤸", "🥂", "🥚", "🥳", "🦷", "🧒", "🧘", "🧩", "🧳", "🧸", "🧹", "🧺",
          "🩰", "🩺", "🪁", "🪴"
        ]
  - file: gfonts://${lettertype}@${lettertype_vet}
    id: f_vet
    size: 26
    bpp: 4
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: gfonts://${lettertype}@${lettertype_vet}
    id: f_kop
    size: 34
    bpp: 4
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: gfonts://${lettertype}@${lettertype_vet}
    id: f_groot
    size: 52
    bpp: 4
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true

display:
  - platform: it8951
    id: epd
    spi_id: epd_spi
    model: seeed-reterminal-e1003
    rotation: ${rotatie}
    update_interval: never
    auto_clear_enabled: false
    grayscale: true
    full_update_every: 30
    lambda: |-
      auto &s = ink::staat();
      auto nu = id(ha_tijd).now();
      if (!nu.is_valid())
        nu = id(rtc_tijd).now();
      if (nu.is_valid()) {
        s.vandaag = {nu.year, nu.month, nu.day_of_month};
        s.tijd_geldig = true;
      }
      const uint8_t mask = ink::ververs_mask();
      ink::ververs_mask() = 0;
      ink::teken(it, s, {id(f_klein), id(f_normaal), id(f_vet), id(f_kop), id(f_groot), ${nep_vet}}, mask);
