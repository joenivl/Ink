# Kopieer naar secrets.yaml (of zet deze regels in de secrets van je
# ESPHome Builder-add-on, /config/esphome/secrets.yaml) en vul je eigen waarden in.
wifi_iot_ssid: "MijnIoTWifi"
wifi_iot_password: "mijn-iot-wifi-wachtwoord"
herstel_wachtwoord: "inkkalender"
# Genereer met: python3 -c "import secrets,base64;print(base64.b64encode(secrets.token_bytes(32)).decode())"
api_sleutel: "VERVANG_DOOR_32_BYTES_BASE64_SLEUTEL_0000000="
# GitHub-token om de privé-repo te lezen (fine-grained token, alleen deze repo,
# Contents: Read-only). Ook gebruikt door homeassistant/packages/ink.yaml.
github_token: "github_pat_VERVANG_DOOR_JE_TOKEN"
